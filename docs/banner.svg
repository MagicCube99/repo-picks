<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9fd"/>
      <stop offset="0.55" stop-color="#f2f4fc"/>
      <stop offset="1" stop-color="#ecfbfc"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="0.45" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#5b21b6" opacity="0.06"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4c1d95" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>
  <circle cx="1010" cy="30" r="250" fill="url(#glowA)"/>
  <circle cx="160" cy="300" r="250" fill="url(#glowB)"/>

  <text x="80" y="122" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="58" font-weight="800" fill="url(#title)" letter-spacing="-1">📌 repo-picks</text>
  <text x="82" y="172" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#5f6676">随手收藏的有趣开源项目 · 不求全面，只记眼前一亮</text>

  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#374151">
    <rect x="82" y="200" width="96" height="34" rx="17" fill="#ffffff" stroke="#e4e7f0" filter="url(#soft)"/>
    <text x="98" y="222">6 个项目</text>
    <rect x="190" y="200" width="96" height="34" rx="17" fill="#ffffff" stroke="#e4e7f0" filter="url(#soft)"/>
    <text x="206" y="222">4 个分类</text>
    <rect x="298" y="200" width="118" height="34" rx="17" fill="#ffffff" stroke="#e4e7f0" filter="url(#soft)"/>
    <text x="314" y="222">MIT License</text>
  </g>

  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="880" y="96" width="240" height="62" rx="31" fill="#ffffff" stroke="#ddd6fe" filter="url(#soft)"/>
    <text x="1000" y="135" text-anchor="middle" font-size="20" font-weight="600" fill="#5b21b6">🌐 在线浏览 →</text>
    <text x="1000" y="192" text-anchor="middle" font-size="14" fill="#8b92a3">magiccube99.github.io/repo-picks</text>
  </g>

  <rect x="0" y="274" width="1200" height="6" fill="url(#accent)"/>
</svg>

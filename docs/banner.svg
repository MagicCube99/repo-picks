<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="0.55" stop-color="#f2f7fe"/>
      <stop offset="1" stop-color="#eefcfd"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1e3a8a" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <circle cx="1040" cy="20" r="260" fill="url(#glowC)"/>
  <circle cx="120" cy="300" r="250" fill="url(#glowB)"/>

  <text x="80" y="44" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="3" fill="#94a3b8">REPO-PICKS / INDEX</text>

  <rect x="80" y="66" width="66" height="66" rx="16" fill="url(#tile)" filter="url(#soft)"/>
  <text x="113" y="112" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="26" font-weight="700" fill="#22d3ee">&gt;_</text>

  <text x="170" y="116" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="50" font-weight="800" fill="url(#title)" letter-spacing="-1">repo-picks</text>
  <text x="172" y="160" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#475569">随手收藏的有趣开源项目 · 不求全面，只记眼前一亮</text>

  <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#334155">
    <rect x="171" y="188" width="104" height="30" rx="6" fill="#ffffff" stroke="#dbe3f0"/>
    <text x="185" y="208">picks: 28</text>
    <rect x="285" y="188" width="140" height="30" rx="6" fill="#ffffff" stroke="#dbe3f0"/>
    <text x="299" y="208">categories: 11</text>
    <rect x="435" y="188" width="132" height="30" rx="6" fill="#ffffff" stroke="#dbe3f0"/>
    <text x="449" y="208">license: MIT</text>
  </g>

  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="880" y="108" width="240" height="58" rx="29" fill="#0f172a" filter="url(#soft)"/>
    <text x="1000" y="145" text-anchor="middle" font-size="19" font-weight="600" fill="#67e8f9">在线浏览 →</text>
    <text x="1000" y="200" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#64748b">magiccube99.github.io/repo-picks</text>
  </g>

  <g stroke="#94a3b8" stroke-opacity="0.5">
    <line x1="1120" y1="40" x2="1136" y2="40"/>
    <line x1="1128" y1="32" x2="1128" y2="48"/>
    <line x1="760" y1="236" x2="776" y2="236"/>
    <line x1="768" y1="228" x2="768" y2="244"/>
  </g>

  <rect x="0" y="274" width="1200" height="6" fill="url(#accent)"/>
</svg>
